<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Fibre Monitoring by DTEAMTECH</title>
  <desc id="desc">Self-hosted Fibre monitoring and traffic exploration with Grafana, Prometheus and OpenTelemetry. Abstract telemetry lines; no Celestia marks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E1014"/><stop offset="1" stop-color="#231860"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#5640D1"/><stop offset="1" stop-color="#7C68F2"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#C4C8CE" stroke-opacity=".07"/></pattern>
  </defs>
