apiVersion: 1

datasources:
  - name: FibreStats JSON
    uid: fibrestats-json
    type: yesoreyeram-infinity-datasource
    access: proxy
    # Compose supplies a private base URL. The public Caddy route blocks this API.
    url: $FIBRESTATS_API_URL
    editable: false
    jsonData:
      auth_method: none
      allowedHosts:
        - $FIBRESTATS_API_URL
      timeoutInSeconds: 10
      proxy_type: none
      allowDangerousHTTPMethods: false
