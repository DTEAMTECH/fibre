# Fibre pushes OTLP/HTTP to http://127.0.0.1:4318 when --otel-endpoint is set.
# The binary appends /v1/metrics and /v1/traces to that base URL.
# Prometheus scrapes the converted metrics at http://collector:8889/metrics.
# Container ports stay on the private Compose network unless compose.yaml
# explicitly publishes them on the host's loopback interface.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Fibre exports every 60s by default. Tolerate one missed cycle, then
    # expire cached series so a stopped server cannot look healthy forever.
    metric_expiration: 2m
    enable_open_metrics: true
    # Keep only the identity attributes used by the dashboard and alerts;
    # arbitrary Kubernetes/cloud metadata must not multiply every series.
    resource_constant_labels:
      included: [service.name, service.version, service.instance.id]

  # The binary pushes traces too. Accept and discard them; no trace store is
  # needed for this metrics-only setup and exporters do not receive 404s.
  nop: {}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop]
