global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Optional integrations mount scrape fragments here; the default stack has none.
scrape_config_files:
  - /etc/prometheus/optional/scrapes/*.yml

scrape_configs:
  - job_name: fibre
    static_configs:
      - targets: [collector:8889]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
