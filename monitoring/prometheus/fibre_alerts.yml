# Optional rules for a local, single-operator Fibre stack.
# Metric contract: celestia-app v10.4.0. OTLP dots become underscores;
# seconds/bytes gain unit suffixes and monotonic counters gain _total.
# Prometheus must scrape the collector with job_name: fibre.
# Thresholds are starting points for operator tuning, not protocol SLOs.
#
# Global absence cannot identify one missing server while another reports.
# Individual alert instances use service_instance_id (the server hostname).
groups:
  - name: fibre-availability
    rules:
      - alert: FibreCollectorScrapeFailed
        expr: up{job="fibre"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cannot scrape the Fibre collector"
          description: "Prometheus cannot scrape {{ $labels.instance }}. Check the collector and its metrics endpoint. This checks the monitoring pipeline, not public Fibre reachability."

      - alert: FibreServerMetricsMissing
        # Occupancy is reported even before the first upload. Event-driven
        # in_flight metrics may not exist yet on a healthy idle server.
        # With metric_expiration: 2m, detection also includes that cache delay.
        expr: absent(fibre_server_upload_shard_occupancy_bytes)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No Fibre server metrics are arriving"
          description: "No server occupancy gauge is available for 5 minutes. Check Fibre's --otel-endpoint, the collector, and its Prometheus scrape. This is a whole-stack check; it cannot detect one missing server while another still reports."

      - alert: FibreUploadSuccessStale
        # The gauge is absent until the first successful RPC. Require this
        # server's completed upload attempts; an idle network is healthy.
        # The failure-rate rule below also covers a server with no successes.
        expr: |
          (time() - fibre_server_upload_shard_last_success_timestamp_seconds > 300)
          and on (service_instance_id)
          (sum by (service_instance_id) (increase(fibre_server_upload_shard_duration_seconds_count[5m])) > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fibre uploads are arriving without successful completion"
          description: "{{ $labels.service_instance_id }} has continued completing upload attempts but has had no successful upload for over 5 minutes. Check upload errors, budget, storage, and signing. This is not an endorsement participation rate."

  - name: fibre-storage
    rules:
      - alert: FibreStorageBudgetHigh
        # Limiter occupancy includes stored bytes and in-flight reservations;
        # it is not filesystem usage. Use the exported budget, not stake math.
        # A non-positive budget disables enforcement, so exclude it.
        expr: |
          (fibre_server_upload_shard_occupancy_bytes / fibre_server_upload_shard_budget_bytes > 0.8)
          and (fibre_server_upload_shard_budget_bytes > 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Fibre storage budget above 80% on {{ $labels.service_instance_id }}"
          description: "Limiter occupancy is {{ $value | humanizePercentage }} of the exported storage budget. At the limit, new shard storage is rejected until capacity is released. Check physical disk space separately."

      - alert: FibreStorageBudgetCritical
        expr: |
          (fibre_server_upload_shard_occupancy_bytes / fibre_server_upload_shard_budget_bytes > 0.95)
          and (fibre_server_upload_shard_budget_bytes > 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fibre storage budget above 95% on {{ $labels.service_instance_id }}"
          description: "Limiter occupancy is {{ $value | humanizePercentage }} of the exported storage budget. New uploads may be rejected. Check budget rejections and prune failures."

      - alert: FibreUploadsRejectedBudgetExceeded
        expr: increase(fibre_server_upload_shard_rejected_total{reason="budget_exceeded"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Fibre uploads rejected for storage budget"
          description: "{{ $labels.service_instance_id }} has rejected uploads because its storage budget is full. Clients may retry; a successful prune releases capacity only when eligible shards exist."

      - alert: FibrePruneFailures
        # A cycle records duration even when nothing is eligible for deletion.
        # No deletions alone cannot prove lag: the retention floor is 4h by
        # default, and this metric surface has no oldest-expired-shard gauge.
        expr: sum by (service_instance_id) (increase(fibre_server_prune_duration_seconds_count{success="false"}[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Fibre prune cycles are failing"
          description: "{{ $labels.service_instance_id }} has recorded at least 3 failed prune cycles in 15 minutes. Check store and payload deletion errors in the Fibre logs. Zero deletions on their own are normal when no shards are eligible."

      - alert: FibreBackendGetErrors
        # Missing blobs and client cancellations are not necessarily faults.
        expr: sum by (service_instance_id, backend) (increase(fibre_server_backend_get_duration_seconds_count{outcome=~"error|timeout|throttled"}[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Fibre storage backend reads are failing"
          description: "{{ $labels.service_instance_id }} has at least 3 failed, timed out, or throttled reads from its {{ $labels.backend }} backend in 15 minutes. Check local storage or the object-store service."

  - name: fibre-requests
    rules:
      - alert: FibreUploadFailureRateHigh
        # Aggregate upload_size before dividing. Require 20 completed RPCs
        # so a few requests on a quiet network do not create noisy ratios.
        expr: |
          (sum by (service_instance_id) (increase(fibre_server_upload_shard_duration_seconds_count{success="false"}[15m]))
          / sum by (service_instance_id) (increase(fibre_server_upload_shard_duration_seconds_count[15m])) > 0.1)
          and on (service_instance_id)
          (sum by (service_instance_id) (increase(fibre_server_upload_shard_duration_seconds_count[15m])) >= 20)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fibre upload failure rate above 10%"
          description: "{{ $labels.service_instance_id }} failed {{ $value | humanizePercentage }} of completed upload RPCs over 15 minutes (at least 20 requests). Inspect budget rejections and server logs; failed RPCs may also come from invalid requests or client cancellation."

      - alert: FibreDownloadFailureRateHigh
        expr: |
          (sum by (service_instance_id) (increase(fibre_server_download_shard_duration_seconds_count{success="false"}[15m]))
          / sum by (service_instance_id) (increase(fibre_server_download_shard_duration_seconds_count[15m])) > 0.1)
          and on (service_instance_id)
          (sum by (service_instance_id) (increase(fibre_server_download_shard_duration_seconds_count[15m])) >= 20)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fibre download failure rate above 10%"
          description: "{{ $labels.service_instance_id }} failed {{ $value | humanizePercentage }} of completed download RPCs over 15 minutes (at least 20 requests). Check storage and server logs; requests for missing or expired blobs can also fail."

      - alert: FibreSigningFailures
        expr: sum by (service_instance_id) (increase(fibre_server_sign_duration_seconds_count{success="false"}[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Fibre payment-promise signing is failing"
          description: "{{ $labels.service_instance_id }} has recorded at least 3 signing failures in 15 minutes. Check its signer gRPC connection and the consensus node logs."

# There is no 10 ms SLO for fibre.server.sign.duration: it includes the
# payment-promise endorsement request. The separate consensus-node metric
# cometbft_privval_signing_latency_* is the signal behind that requirement.
# Keep latency panels for diagnosis; choose an alert threshold from your own
# observed workloads and the client/server locations rather than network ping.
