        values: "1+0x20"
      - series: "fibrestats_source_healthy{job=\"fibrestats\",instance=\"probe:3000\",network=\"Mocha\",chain_id=\"mocha-5\",source=\"materializer\"}"
        values: "1+0x20"
      - series: "fibrestats_provider_registered{job=\"fibrestats\",instance=\"probe:3000\",network=\"Mocha\",chain_id=\"mocha-5\",provider=\"1111111111111111111111111111111111111111\"}"
        values: "1+0x20"
      - series: "fibrestats_probe_current_available{job=\"fibrestats\",instance=\"probe:3000\",network=\"Mocha\",chain_id=\"mocha-5\",provider=\"1111111111111111111111111111111111111111\",vantage=\"probe-host-1\"}"
        values: "1+0x20"
      - series: "fibrestats_probe_ready{job=\"fibrestats\",instance=\"probe:3000\",network=\"Mocha\",chain_id=\"mocha-5\",provider=\"1111111111111111111111111111111111111111\",vantage=\"probe-host-1\"}"
        values: "1+0x20"
      - series: "fibrestats_probe_duration_seconds{job=\"fibrestats\",instance=\"probe:3000\",network=\"Mocha\",chain_id=\"mocha-5\",provider=\"1111111111111111111111111111111111111111\",vantage=\"probe-host-1\",stage=\"tcp\"}"
        values: "0.02+0x20"
      - series: "fibrestats_settlements{job=\"fibrestats\",instance=\"probe:3000\",network=\"Mocha\",chain_id=\"mocha-5\",window=\"24h\"}"
        values: "20+0x20"
      - series: "fibrestats_window_complete{job=\"fibrestats\",instance=\"probe:3000\",network=\"Mocha\",chain_id=\"mocha-5\",window=\"24h\"}"
        values: "1+0x20"
    promql_expr_test:
      - expr: "ALERTS{alertstate=\"firing\"}"
        eval_time: 20m
        exp_samples: []

