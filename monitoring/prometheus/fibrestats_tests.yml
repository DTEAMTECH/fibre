# Synthetic contract-v1 behavior: no chain access or public probes.
# docker run --rm --entrypoint promtool -v "$PWD:/work:ro" -w /work \
#   prom/prometheus:v3.5.4 test rules fibrestats_tests.yml
rule_files:
  - fibrestats_alerts.yml
evaluation_interval: 1m
tests:
  - name: "healthy covered traffic and fresh probes stay quiet"
    interval: 1m
    input_series:
      - series: "up{job=\"fibrestats\",instance=\"probe:3000\",alert_provider=\"1111111111111111111111111111111111111111\",alert_network=\"Mocha\"}"
        values: "1+0x20"
      - series: "fibrestats_source_healthy{job=\"fibrestats\",instance=\"probe:3000\",network=\"Mocha\",chain_id=\"mocha-5\",source=\"chain\"}"
        values: "1+0x20"
      - series: "fibrestats_source_healthy{job=\"fibrestats\",instance=\"probe:3000\",network=\"Mocha\",chain_id=\"mocha-5\",source=\"index\"}"
        values: "1+0x20"
