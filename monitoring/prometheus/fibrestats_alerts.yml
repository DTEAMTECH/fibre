# Optional operator-owned FibreStats contract v1 alerts. Enable only with both
# FibreStats scraping (job_name: fibrestats) and Alertmanager. All source metrics
# are gauges; none of these rules interprets a rolling count as a counter.
#
# Provider alerts are disabled unless a scrape target has both alert_provider
# (the watched lowercase 40-character hex provider ID) and alert_network
# (Mainnet or Mocha) labels. Collection/API alerts work without these labels.
# Configure one watched provider/network per target in fibrestats/targets.yml;
# never infer identity from the private Fibre service_instance_id or a hostname.
#
# Freshness is enforced by FibreStats: chain/observer/materializer 180 seconds,
# index 300 seconds. Missing samples remain unknown. up gates prevent retained
# gauges from firing provider/source alerts after an HTTP scrape fails.
groups:
  - name: fibrestats-collection
    rules:
      - alert: FibreStatsScrapeUnavailable
        expr: up{job="fibrestats"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cannot scrape the self-hosted FibreStats instance"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 2 minutes. Check the private network path and FibreStats web service. This is monitoring transport failure, not a public Fibre endpoint verdict."

      - alert: FibreStatsSourceUnavailable
        # Geolocation and read-only reconstruction are optional. Endorsement
        # enrichment completeness is shown in Grafana; it is not provider duty.
        expr: |
          (fibrestats_source_healthy{job="fibrestats",source=~"chain|index|observer|materializer"} == 0)
          and on (job, instance)
          (up{job="fibrestats"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FibreStats {{ $labels.source }} collection is unavailable or stale"
          description: "{{ $labels.network }} source {{ $labels.source }} on {{ $labels.instance }} has been unhealthy for 5 minutes while HTTP scraping works. Inspect source status, record time and last attempt in Grafana or /api/integration/status. Receipt of an unchanged old chain tip is not fresh chain progress."

  - name: fibrestats-provider-observations
    rules:
      - alert: FibreStatsProviderUnreachable
        expr: |
          (fibrestats_probe_ready{job="fibrestats"} == 0)
          and on (job, instance, network, chain_id, provider, vantage)
          (fibrestats_probe_current_available{job="fibrestats"} == 1)
          and on (job, instance, network, chain_id, provider)
          (fibrestats_provider_registered{job="fibrestats"} == 1)
          and on (job, instance, network, chain_id)
          (fibrestats_source_healthy{job="fibrestats",source="chain"} == 1)
          and on (job, instance, network, chain_id)
          (fibrestats_source_healthy{job="fibrestats",source="observer"} == 1)
          and on (job, instance, network, chain_id)
          (fibrestats_source_healthy{job="fibrestats",source="materializer"} == 1)
          and on (job, instance, network, provider)
          label_replace(
            label_replace(
              (up{job="fibrestats",alert_provider=~"[a-f0-9]{40}",alert_network=~"Mainnet|Mocha"} == 1),
              "provider", "$1", "alert_provider", "(.+)"
            ),
            "network", "$1", "alert_network", "(.+)"
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fibre endpoint checks are failing from {{ $labels.vantage }}"
          description: "{{ $labels.network }} provider {{ $labels.provider }} has fresh failed readiness checks for 5 minutes from {{ $labels.vantage }}. Inspect the DNS, TCP, TLS and identity stages. This is an observation from this probe location, not proof of a network-wide outage or a missed endorsement."

      - alert: FibreStatsProviderObservationUnavailable
        expr: |
          (fibrestats_probe_current_available{job="fibrestats"} == 0)
          and on (job, instance, network, chain_id, provider)
          (fibrestats_provider_registered{job="fibrestats"} == 1)
          and on (job, instance, network, chain_id)
          (fibrestats_source_healthy{job="fibrestats",source="chain"} == 1)
          and on (job, instance, network, chain_id)
          (fibrestats_source_healthy{job="fibrestats",source="observer"} == 1)
          and on (job, instance, network, chain_id)
          (fibrestats_source_healthy{job="fibrestats",source="materializer"} == 1)
          and on (job, instance, network, provider)
          label_replace(
            label_replace(
              (up{job="fibrestats",alert_provider=~"[a-f0-9]{40}",alert_network=~"Mainnet|Mocha"} == 1),
              "provider", "$1", "alert_provider", "(.+)"
            ),
            "network", "$1", "alert_network", "(.+)"
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No current Fibre endpoint verdict from {{ $labels.vantage }}"
          description: "{{ $labels.network }} provider {{ $labels.provider }} is registered but has had no available fresh verdict for 5 minutes while chain, observer and materializer sources are healthy. Check the actual last attempt and blocked/stale/not-attempted stages. This means unknown readiness, not a measured endpoint failure."

      - alert: FibreStatsTCPConnectionLatencyHigh
        # Starting point: successful TCP handshakes above 0.5 seconds for 10m.
        # Tune 0.5 and the for duration to your probe location and baseline.
        # This is latest saved TCP connection time, not ICMP ping, a histogram,
        # a percentile or Fibre upload/signing latency. Require ready checks so
        # a timeout duration does not also become a high-latency incident.
        expr: |
          (fibrestats_probe_duration_seconds{job="fibrestats",stage="tcp"} > 0.5)
          and on (job, instance, network, chain_id, provider, vantage)
          (fibrestats_probe_ready{job="fibrestats"} == 1)
          and on (job, instance, network, chain_id, provider, vantage)
          (fibrestats_probe_current_available{job="fibrestats"} == 1)
          and on (job, instance, network, chain_id, provider)
          (fibrestats_provider_registered{job="fibrestats"} == 1)
          and on (job, instance, network, chain_id)
          (fibrestats_source_healthy{job="fibrestats",source="chain"} == 1)
          and on (job, instance, network, chain_id)
          (fibrestats_source_healthy{job="fibrestats",source="observer"} == 1)
          and on (job, instance, network, chain_id)
          (fibrestats_source_healthy{job="fibrestats",source="materializer"} == 1)
          and on (job, instance, network, provider)
          label_replace(
            label_replace(
              (up{job="fibrestats",alert_provider=~"[a-f0-9]{40}",alert_network=~"Mainnet|Mocha"} == 1),
              "provider", "$1", "alert_provider", "(.+)"
            ),
            "network", "$1", "alert_network", "(.+)"
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained high TCP connection time from {{ $labels.vantage }}"
          description: "{{ $labels.network }} provider {{ $labels.provider }} has fresh ready checks with TCP connection time above 500 ms for 10 minutes from {{ $labels.vantage }}. Tune the threshold to your geographic baseline. This measurement is not ICMP ping or an RPC latency percentile."

# No missing-endorsement alert: recorded inclusions / known historical
# memberships is descriptive evidence, not a missed-duty or service-success
# rate. Clients may stop collecting signatures after quorum. Unresolved
# membership is network-level unknown evidence, never provider failure.
